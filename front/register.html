<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro | Sistema OS</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="login-container">
        <h1 class="logo-title">Sistema OS</h1>
        <h2 class="form-title">Crie sua Conta</h2>

        <form id="registerForm" class="login-form">
            <div class="input-group">
                <label for="registerNome">Nome Completo</label>
                <input type="text" id="registerNome" name="nome" placeholder="Seu nome completo" required>
            </div>

            <div class="input-group">
                <label for="registerEmail">E-mail</label>
                <input type="email" id="registerEmail" name="email" placeholder="Seu e-mail (será seu login)" required>
            </div>

            <div class="input-group">
                <label for="registerSenha">Senha</label>
                <input type="password" id="registerSenha" name="senha" placeholder="Crie uma senha forte" required>
            </div>

            <button type="submit" class="btn primary-btn">Criar Conta</button>

            <div id="registerMessage" class="message-area"></div>

            <p class="register-link">
                Já tem conta? <a href="login.html">Faça login aqui</a>
            </p>
        </form>
    </div>

    <script src="scripts.js"></script>
</body>
</html>
