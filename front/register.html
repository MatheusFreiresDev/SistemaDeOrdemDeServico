<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro | ServiçOS</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap">
    <link rel="stylesheet" href="styles.css">
</head>
<body class="auth-page">

<div class="auth-split">

    <!-- LEFT PANEL -->
    <div class="auth-brand">
        <div class="brand-content">
            <div class="brand-logo">⚙</div>
            <h1 class="brand-title">ServiçOS</h1>
            <p class="brand-desc">Crie sua conta e comece a gerenciar suas ordens de serviço agora mesmo.</p>
            <div class="brand-features">
                <div class="feature-item">
                    <span class="feature-dot"></span>
                    <span>Cadastro rápido e gratuito</span>
                </div>
                <div class="feature-item">
                    <span class="feature-dot"></span>
                    <span>Acesso imediato ao painel</span>
                </div>
                <div class="feature-item">
                    <span class="feature-dot"></span>
                    <span>Notificações por e-mail incluídas</span>
                </div>
            </div>
        </div>
        <div class="brand-grid"></div>
    </div>

    <!-- RIGHT PANEL -->
    <div class="auth-form-panel">
        <div class="auth-form-wrap">
            <div class="auth-header">
                <h2>Criar conta</h2>
                <p>Preencha os dados abaixo para se cadastrar</p>
            </div>

            <form id="registerForm" method="post" action="#">
                <div class="field">
                    <label for="registerNome">Nome completo</label>
                    <input type="text" id="registerNome" name="nome" placeholder="Seu nome completo" required>
                </div>

                <div class="field">
                    <label for="registerEmail">E-mail</label>
                    <input type="email" id="registerEmail" name="email" placeholder="seu@email.com" required>
                </div>

                <div class="field">
                    <label for="registerSenha">Senha</label>
                    <input type="password" id="registerSenha" name="senha" placeholder="Mínimo 6 caracteres" required>
                </div>

                <button type="submit" class="btn-auth">Criar minha conta</button>

                <div id="registerMessage" class="auth-message"></div>

                <p class="auth-link">Já tem conta? <a href="login.html">Fazer login</a></p>
            </form>
        </div>
    </div>

</div>

<script src="scripts.js"></script>
</body>
</html>
