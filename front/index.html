<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard | Sistema OS</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div id="osList" class="container">

        <header class="dashboard-header">
            <div class="header-left">
                <span class="logo-badge">OS</span>
                <div>
                    <h1 id="userNameDisplay">Olá!</h1>
                    <p class="header-subtitle">Gerencie suas ordens de serviço</p>
                </div>
            </div>
            <button id="logoutBtn" class="btn btn-ghost">Sair 🚪</button>
        </header>

        <div class="toolbar">
            <button id="open-modal-btn" class="btn btn-primary">➕ Nova OS</button>
        </div>

        <div class="table-wrapper">
            <table>
                <thead>
                    <tr>
                        <th>Título</th>
                        <th>Status</th>
                        <th>Prioridade</th>
                        <th>Categoria</th>
                        <th>Ações</th>
                    </tr>
                </thead>
                <tbody id="ordens-list">
                    <tr><td colspan="5" class="loading-cell">Carregando...</td></tr>
                </tbody>
            </table>
        </div>

    </div>

    <!-- Toast de notificação -->
    <div id="toast" class="toast"></div>

    <!-- Modal -->
    <div id="os-modal" class="modal">
        <div class="modal-content">
            <button class="close-btn" aria-label="Fechar">&times;</button>
            <h2 id="modal-title">Nova Ordem de Serviço</h2>

            <form id="create-form">
                <input type="hidden" id="osId">

                <div class="form-group">
                    <label for="titulo">Título</label>
                    <input type="text" id="titulo" placeholder="Descreva brevemente o problema" required>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="categoria">Categoria</label>
                        <select id="categoria" required>
                            <option value="RECLAMACAO">Reclamação</option>
                            <option value="MANUTENCAO">Manutenção</option>
                            <option value="DUVIDA">Dúvida</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="prioridade">Prioridade</label>
                        <select id="prioridade" required>
                            <option value="BAIXA">Baixa</option>
                            <option value="MEDIA">Média</option>
                            <option value="ALTA">Alta</option>
                        </select>
                    </div>
                </div>

                <div class="form-group" id="status-group" style="display:none">
                    <label for="status">Status</label>
                    <select id="status">
                        <option value="ABERTO">Aberto</option>
                        <option value="EM_EXECUCAO">Em Execução</option>
                        <option value="CONCLUIDO">Concluído</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="descricao">Descrição</label>
                    <textarea id="descricao" rows="3" placeholder="Detalhes adicionais..."></textarea>
                </div>

                <div id="form-message" class="message" style="display:none"></div>
                <button type="submit" class="btn btn-primary btn-full" id="submit-btn">Criar OS</button>
            </form>
        </div>
    </div>

    <script src="scripts.js"></script>
</body>
</html>
