<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <title>Lista de Ordens de Serviço | Sistema OS</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <div id="osList" class="container">

        <h1 id="userNameDisplay">Olá!</h1>
        <button id="logoutBtn" class="logout-floating">Sair 🚪</button>
        <button id="open-modal-btn">➕ Criar Nova Ordem de Serviço</button>
<h2>📋 Suas Ordens de Serviço</h2>

        <table>
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Título</th>
                    <th>Status</th>
                    <th>Prioridade</th>
                    <th>Categoria</th>
                    <th>Ações</th>
                </tr>
            </thead>
            <tbody id="ordens-list">
                <tr>
                    <td colspan="6">Carregando dados, por favor aguarde...</td>
                </tr>
            </tbody>
        </table>

    </div>

    <div id="os-modal" class="modal">
        <div class="modal-content">
            <span class="close-btn">&times;</span>
            <h2>Cadastrar Nova OS</h2>

            <form id="create-form">
                <input type="hidden" id="osId">
                <label for="titulo">Título:</label>
                <label for="usuarioId">ID do Usuário/Criador:</label>
                <input type="number" id="usuarioId" required value="1" min="1" disabled>

                <label for="titulo">Título:</label>
                <input type="text" id="titulo" required>

                <label for="categoria">Categoria:</label>
                <select id="categoria" required>
                    <option value="RECLAMACAO">RECLAMACAO</option>
                    <option value="MANUTENCAO">MANUTENÇÃO</option>
                    <option value="DUVIDA">DUVIDA</option>
                </select>

                <label for="status">Status:</label>
                <select id="status" required>
                    <option value="ABERTO">ABERTO</option>
                    <option value="EM_EXECUCAO">EM EXECUÇÃO</option>
                    <option value="CONCLUIDO">CONCLUÍDO</option>
                </select>

                <label for="prioridade">Prioridade:</label>
                <select id="prioridade" required>
                    <option value="BAIXA">BAIXA</option>
                    <option value="MEDIA">MÉDIA</option>
                    <option value="ALTA">ALTA</option>
                </select>

                <label for="descricao">Descrição:</label>
                <input type="text" id="descricao">

                <button type="submit">Cadastrar OS</button>
                <div id="form-message" class="message" style="display: none;"></div>
            </form>
        </div>
    </div>
    <script src="scripts.js"></script>
</body>

</html>
